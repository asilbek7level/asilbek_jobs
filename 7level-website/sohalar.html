<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sohalar — 7Level</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="site-header"></div>
    <main>
        <div class="page-hero">
            <div class="breadcrumb"><a href="index.html">Bosh sahifa</a> / Sohalar</div>
            <div class="section-tag">Kasbiy yo'nalishlar</div>
            <h1 style="font-size:42px;margin:12px 0;">12 ta soha — chuqur sahifa</h1>
            <p style="color:rgba(255,255,255,.65);max-width:640px;margin:0 auto;">Kartani bosing: ko'nikma, kasblar, maosh orientiri va birinchi qadamlar. Bu “yagona to'g'ri kasb” ro'yxati emas.</p>
        </div>
        <div class="container" style="padding-top:0;">
            <div class="fields-grid" id="fieldsGrid"></div>
        </div>
    </main>
    <div id="site-footer"></div>
    <script src="js/data.js"></script>
    <script src="js/common.js"></script>
    <script>
        document.getElementById('fieldsGrid').innerHTML = fieldsData.map(field => `
            <a class="field-card fade-in" href="soha.html?id=${field.id}">
                <div class="field-icon" style="background:${field.iconBg}">${field.icon}</div>
                <h3>${field.name}</h3>
                <p>${field.shortDesc}</p>
                <div class="field-meta">
                    ${field.tags.map(t => `<span class="field-tag">${t}</span>`).join('')}
                    <span class="demand-badge ${field.demand === 'high' ? 'demand-high' : field.demand === 'medium' ? 'demand-medium' : 'demand-growing'}">${field.demandLabel}</span>
                </div>
            </a>
        `).join('');
        document.querySelectorAll('.fade-in').forEach(el => el.classList.add('visible'));
    </script>
</body>
</html>
